name: Repair Spoolman filament picker crash

on:
  push:
    branches:
      - spoolman-profile-link
    paths:
      - .github/workflows/repair-spoolman-picker.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spoolman-profile-link
          fetch-depth: 0

      - name: Apply safe picker layout
        run: python3 .github/repair_spoolman_picker.py

      - name: Commit repaired picker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/repair_spoolman_picker.py
          git rm .github/workflows/repair-spoolman-picker.yml
          git add src/slic3r/GUI/Tab.cpp
          git diff --cached --check
          git commit -m "Fix crash when opening filament editor"
          git push origin HEAD:spoolman-profile-link

